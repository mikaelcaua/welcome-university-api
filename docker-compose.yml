version: '3.8'

services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8080}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_JWT_SECRET: ${API_JWT_SECRET}
      API_ACCESS_TOKEN_EXPIRATION_SECONDS: ${API_ACCESS_TOKEN_EXPIRATION_SECONDS:-900}
      API_REFRESH_TOKEN_EXPIRATION_SECONDS: ${API_REFRESH_TOKEN_EXPIRATION_SECONDS:-604800}
      API_MAX_UPLOAD_MB: ${API_MAX_UPLOAD_MB:-25}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-exams-bucket}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 160M
        reservations:
          memory: 64M
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${API_PORT}/actuator/health/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - DOCKER_API_VERSION=1.44
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
    environment:
      API_PORT: ${API_PORT:-8080}
    ports:
      - "80:80"   
      - "443:443"  
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
